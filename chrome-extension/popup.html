<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apheron Job Tracker</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #1976d2;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .status.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.disconnected {
      background: #ffebee;
      color: #c62828;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    button:hover {
      background: #1565c0;
    }
    button.secondary {
      background: #f5f5f5;
      color: #333;
    }
    button.secondary:hover {
      background: #e0e0e0;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="Apheron" class="logo">
    <h1>Apheron Job Tracker</h1>
  </div>

  <div id="status" class="status disconnected">
    Non connesso
  </div>

  <button id="connectBtn">Connetti ad Apheron</button>
  <button id="openAppBtn" class="secondary">Apri App</button>
  <button id="savedJobsBtn" class="secondary">Posizioni Salvate</button>

  <div class="info">
    Clicca su "💾 Salva in Apheron" nelle pagine dei job boards per salvare posizioni
  </div>

  <script src="popup.js"></script>
</body>
</html>
